baseURL = "https://opencourant.org/"
locale = "en-us"
title = "OpenCourant"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "OpenCourant is the community continuation of OpenRadioss, an open-source finite element solver for crash, impact, and highly nonlinear dynamic simulation."
  # NOTE: `github` must stay pointing at the solver repository;
  # layouts/partials/github-releases.html derives the Releases API path from it.
  github = "https://github.com/OpenCourant/OpenCourant"
  forum = "https://github.com/orgs/OpenCourant/discussions"
  chat = "https://chat.rockylinux.org/rocky-linux/channels/opencourant"
  email = "hello@opencourant.org"

# Release packages shown on /downloads/.
#
# The downloads page is rendered at build time from the GitHub Releases API
# (see layouts/partials/github-releases.html). Each platform below reserves a
# card on that page; the card is populated automatically as soon as a release
# publishes an asset whose file name matches `asset`, and otherwise renders as
# "not yet available" with `reason` shown.
#
# Consequence: when the delivery workflow starts shipping win64 or linuxa64
# packages again, those cards light up with no change to this site. A new
# platform is one more block here.
#
# `releases` is the number of releases to request from the API. The delivery
# workflow prunes to the 3 most recent latest-* tags, so 10 is ample headroom.
[params.downloads]
  releases = 10

  [[params.downloads.platforms]]
    id = "linux64"
    name = "Linux x86-64"
    asset = "OpenCourant_linux64.zip"
    note = "Starter and Engine in single and double precision, SMP and OpenMPI builds, plus the anim_to_vtk and th_to_csv converters and the launcher GUI. The _ompi Engines require OpenMPI 4.1.2; the SMP Engines run standalone."
    reason = "Not present in the most recent release. Linux x86-64 builds run in the stable pipeline, so this is normally a transient gap rather than a missing platform. Check the releases page on GitHub."

  [[params.downloads.platforms]]
    id = "linuxa64"
    name = "Linux arm64"
    asset = "OpenCourant_linuxa64.zip"
    note = "Starter and Engine in single and double precision, SMP and OpenMPI builds, plus the anim_to_vtk and th_to_csv converters and the launcher GUI. The _ompi Engines require OpenMPI 4.1.2; the SMP Engines run standalone."
    reason = "Not present in the most recent release. Linux arm64 builds run in the stable pipeline, so this is normally a transient gap rather than a missing platform. Check the releases page on GitHub."

  [[params.downloads.platforms]]
    id = "win64"
    name = "Windows x86-64"
    asset = "OpenCourant_win64.zip"
    note = "Starter and Engine in single and double precision, SMP only, with no MPI Engine yet. Includes the converters, the launcher GUI, and the bundled Intel runtime libraries. Set KMP_STACKSIZE=400m before running."
    reason = "Not present in the most recent release. Windows builds run in the stable pipeline, so this is normally a transient gap rather than a missing platform. Check the releases page on GitHub."

# Container images shown on /downloads/.
#
# The images are published to both registries by the same delivery pipeline
# that cuts the release, tagged `latest` and `latest-YYYYMMDD`. The downloads
# page renders the pull commands against the tag of the release it is showing,
# so they stay in step automatically.
#
# The SIF entries below are ordinary release assets, matched by file name the
# same way the platform cards are. They render only once the Apptainer build
# starts publishing them; until then the page shows `apptainer pull` instead.
[params.downloads.containers]
  ghcr = "ghcr.io/opencourant/opencourant"
  dockerhub = "docker.io/opencourant/opencourant"

  [[params.downloads.containers.sif]]
    name = "Linux x86-64"
    asset = "OpenCourant_linux64.sif"

  [[params.downloads.containers.sif]]
    name = "Linux arm64"
    asset = "OpenCourant_linuxa64.sif"

[markup.goldmark.renderer]
  unsafe = true

# resources.GetRemote caches to disk and defaults to maxAge = -1 (never
# expires), which would pin local builds to the first API response forever.
# CI runners start with a cold cache, so this only affects local development.
[caches.getresource]
  maxAge = "15m"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

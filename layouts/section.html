{{ define "main" }}
<section class="section page">
  <div class="container narrow">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <ul class="news-list">
      {{ range .Pages }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <p>{{ .Summary | plainify }}</p>
      </li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
